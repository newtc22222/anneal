<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anneal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300..600&display=swap">
<style>
/* Layout: sticky top bar; home is a wide topic map with an info card, lessons are one reading column.
   Palette: the Patina/Temper paper, with Anneal's own heat scale — steel (not yet) to ember (learned). */
:root {
  --paper: #f3efe6; --paper-2: #e8e1d4; --card: #fbf8f2;
  --ink: #1c1915; --ink-soft: #3f382f; --muted: #5e564e; --line: #ddd4c6;
  --ember: #b8560f; --ember-deep: #8a3d08; --ember-soft: #f6e3d0; --amber: #e0962e;
  --steel: #6f8292; --steel-soft: #dfe5ea;
  --ok: #2f6b45; --ok-soft: #dcebdf;
  --code: #241f1b; --code-fg: #f6f1e8; --code-dim: #b7aa9c; --code-key: #f0b08a; --code-str: #e7d3a4;
  --code-ty: #a9d1c6; --code-num: #e9c27d; --code-mac: #9fc0ea; --code-line: #3c352e;
  --f-display: "Fraunces", Georgia, serif;
  --f-sans: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161311; --paper-2: #221d19; --card: #1e1a17;
    --ink: #f3efe6; --ink-soft: #e6dfd2; --muted: #b7aa9c; --line: #3c352e;
    --ember: #f0954a; --ember-deep: #f7b47a; --ember-soft: #3a2619; --amber: #f5b75c;
    --steel: #8fa3b3; --steel-soft: #26303a; --ok: #7fc495; --ok-soft: #1d2b21; --code: #100e0c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161311; --paper-2: #221d19; --card: #1e1a17;
  --ink: #f3efe6; --ink-soft: #e6dfd2; --muted: #b7aa9c; --line: #3c352e;
  --ember: #f0954a; --ember-deep: #f7b47a; --ember-soft: #3a2619; --amber: #f5b75c;
  --steel: #8fa3b3; --steel-soft: #26303a; --ok: #7fc495; --ok-soft: #1d2b21; --code: #100e0c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 30; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
code, pre { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; border-radius: 3px; }
::selection { background: var(--ember-soft); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }

.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 780px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 16px; z-index: 50; background: var(--card); padding: 8px 12px; }

/* Top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); }
.top .rule { height: 4px; background: linear-gradient(90deg, var(--steel) 0%, var(--ember) 55%, var(--amber) 100%); }
.top .bar { border-bottom: 1px solid var(--line); }
.top .row { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand span { font-family: var(--f-display); font-size: 20px; }
nav.main { display: flex; gap: 2px; margin-left: 16px; }
nav.main a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 8px; font-size: 14.5px; color: var(--muted); text-decoration: none; }
nav.main a:hover, nav.main a[aria-current="page"] { color: var(--ink); }
nav.main a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--ember); border-radius: 0; }
.count { margin-left: auto; font-family: var(--f-mono); font-size: 14px; color: var(--muted); text-decoration: none; font-variant-numeric: tabular-nums; min-height: 44px; display: inline-flex; align-items: center; }
@media (max-width: 640px) {
  .top .row { flex-wrap: wrap; }
  nav.main { order: 3; width: 100%; margin: 0; border-top: 1px solid var(--line); overflow-x: auto; }
  nav.main a { padding: 0 10px; flex: none; }
}

main { padding-block: 40px 72px; }
.eyebrow { font-family: var(--f-mono); font-size: 13.5px; color: var(--ember); }
.lede { font-size: 18px; line-height: 1.6; color: var(--ink-soft); max-width: 44rem; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
code.i { font-size: .88em; background: var(--paper-2); padding: .08em .35em; border-radius: 5px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--ember); background: var(--ember); color: var(--card); font-weight: 500; text-decoration: none; }
.btn:hover { background: var(--ember-deep); border-color: var(--ember-deep); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #1c1915; } }
:root[data-theme="dark"] .btn { color: #1c1915; }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.quiet:hover { border-color: var(--ink); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .4; cursor: default; }
.link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.link:hover { text-decoration-color: var(--ember); }

/* Home */
.hero h1 { font-size: clamp(36px, 6vw, 62px); max-width: 52rem; margin-top: 12px; }
.hero .lede { margin-top: 18px; }
.family { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14.5px; color: var(--muted); }
.family a, .family b { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; background: var(--card); }
.family a:hover { border-color: var(--ink); }
.family b { font-weight: 500; color: var(--ink); border-color: var(--ember); background: var(--ember-soft); }
.family .arr { color: var(--muted); }
.start-row { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.progress { margin-top: 18px; height: 4px; max-width: 340px; background: var(--steel-soft); }
.progress i { display: block; height: 4px; background: linear-gradient(90deg, var(--ember), var(--amber)); }
.qcount { margin-top: 10px; font-size: 14px; color: var(--muted); }
.qcount b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.mapsec { margin-top: 48px; }
.mapsec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.mapsec-head h2 { font-size: 32px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--steel); }
.legend i.d { background: var(--ember); border-color: var(--ember); }
.legend i.n { border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-soft); }
.mapgrid { margin-top: 16px; }
.mapbox { border: 1px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; position: relative; }
.mapscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mapscroll svg { display: block; width: 100%; min-width: 860px; height: auto; }
.maphint { display: none; font-size: 12.5px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--line); }
@media (max-width: 900px) { .maphint { display: block; } }

/* map drawing */
.m-region rect { fill: var(--paper); stroke: var(--line); stroke-width: 1; }
.m-region text { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
.m-edge { fill: none; stroke: var(--steel); stroke-width: 1.4; stroke-dasharray: 3 5; opacity: .7; transition: opacity .25s, stroke-width .25s, stroke .25s; }
.m-edge.cross { opacity: .45; }
.m-edge.warm { stroke: var(--ember); stroke-dasharray: none; stroke-width: 2; opacity: .85; }
.m-dot { fill: var(--amber); }
.m-node { cursor: pointer; }
.m-node circle.c { fill: var(--card); stroke: var(--steel); stroke-width: 2; transition: fill .3s, stroke .3s, transform .3s; transform-box: fill-box; transform-origin: center; }
.m-node text.n { font-family: var(--f-mono); font-size: 11px; fill: var(--steel); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.m-node text.l { font-family: var(--f-sans); font-size: 13.5px; fill: var(--ink-soft); text-anchor: middle; pointer-events: none; }
.m-node.ready circle.c { stroke: var(--ember); }
.m-node.ready text.n { fill: var(--ember); }
.m-node.done circle.c { fill: var(--ember); stroke: var(--ember); }
.m-node.done text.n { fill: var(--card); }
.m-node .ring { fill: none; stroke: var(--ember); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.m-node.next .ring { animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }
.m-node:hover circle.c, .m-node:focus-visible circle.c, .m-node.sel circle.c { transform: scale(1.18); }
.m-node:focus { outline: none; }
.m-node:focus-visible circle.c { stroke-width: 3.5; }
.m-out rect { fill: var(--paper-2); stroke: var(--ink-soft); stroke-width: 1.2; }
.m-out text { font-family: var(--f-display); font-size: 17px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.m-out text.s { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.m-out { cursor: pointer; }
.m-out:hover rect, .m-out:focus-visible rect { stroke: var(--ember); stroke-width: 2; }
svg.dim .m-edge:not(.hl) { opacity: .12; }
svg.dim .m-node:not(.hl), svg.dim .m-out:not(.hl) { opacity: .35; }
svg.dim .m-edge.hl { opacity: 1; stroke-width: 2.6; stroke: var(--ember); stroke-dasharray: none; }
.m-node, .m-out { transition: opacity .25s; }
svg.intro .m-edge { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s ease-out forwards; animation-delay: var(--d); }
svg.intro .m-edge:not(.warm) { animation-name: drawCold; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes drawCold { 99% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; stroke-dasharray: 3 5; } }
.pop { transform-box: fill-box; transform-origin: center; }
svg.intro .pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: var(--d); }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
svg.launch .m-node.sel circle.c { transform: scale(3.2); fill: var(--ember); transition: transform .32s ease-in, fill .2s; }
svg.launch > *:not(.m-nodes) { opacity: .15; transition: opacity .25s; }

.infocard { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 16px; display: flex; flex-direction: column; gap: 8px; position: absolute; top: 14px; right: 14px; width: 280px; z-index: 2; box-shadow: 0 6px 24px rgba(28, 25, 21, .08); }
.infocard .k { font-family: var(--f-mono); font-size: 12.5px; color: var(--ember); }
.infocard h3 { font-size: 22px; }
.infocard p { font-size: 14.5px; color: var(--ink-soft); }
.infocard .rel { font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.infocard .rel b { font-weight: 500; color: var(--ink-soft); }
.infocard .rel a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--line); }
.infocard .st { font-size: 13px; }
@media (max-width: 1100px) { .mapbox { display: flex; flex-direction: column-reverse; } .infocard { position: static; width: auto; box-shadow: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; } }

.path { margin-top: 56px; }
.path > h2 { font-size: 30px; }
.track { margin-top: 28px; }
.track h3 { font-family: var(--f-mono); font-size: 13.5px; color: var(--muted); font-weight: 400; }
.track h3 span { color: var(--ink-soft); }
.lessons { list-style: none; padding: 0; margin: 8px 0 0; border-top: 1px solid var(--line); }
.lessons a { display: flex; align-items: center; gap: 16px; min-height: 58px; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.lessons a:hover .t { color: var(--ember-deep); }
.lessons .num { width: 32px; flex: none; font-family: var(--f-display); font-style: italic; font-size: 19px; color: var(--ember); font-variant-numeric: tabular-nums; }
.lessons .body { flex: 1; min-width: 0; }
.lessons .t { display: block; font-family: var(--f-display); font-size: 20px; }
.lessons .s { display: block; font-size: 14.5px; color: var(--muted); margin-top: 2px; }
.lessons .min { flex: none; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.lessons .tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--steel); display: grid; place-items: center; font-size: 13px; color: transparent; }
.lessons .done .tick { background: var(--ember); border-color: var(--ember); color: var(--card); }
@media (max-width: 560px) { .lessons .s { display: none; } }
.reset { margin-top: 44px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

/* Lesson */
.lesson-head h1 { font-size: clamp(32px, 5vw, 46px); margin-top: 8px; }
.lesson-head .lede { margin-top: 14px; }
.sits { margin-top: 26px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
.sits-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.sits-h .label { font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; font-size: 11.5px; }
.sits svg { display: block; width: 100%; height: auto; }
.mm-edge { fill: none; stroke: var(--steel); stroke-width: 1.5; stroke-dasharray: 3 5; }
.mm-edge.warm { stroke: var(--ember); stroke-dasharray: none; stroke-width: 2; }
.mm-node rect { fill: var(--paper); stroke: var(--steel); stroke-width: 1.4; }
.mm-node.done rect { fill: var(--ember-soft); stroke: var(--ember); }
.mm-node.out rect { fill: var(--paper-2); stroke: var(--ink-soft); }
.mm-node.cur rect { fill: var(--ember); stroke: var(--ember); }
.mm-node text { font-family: var(--f-sans); font-size: 13.5px; fill: var(--ink); dominant-baseline: central; }
.mm-node text.n { font-family: var(--f-mono); font-size: 11.5px; fill: var(--muted); }
.mm-node.cur text { fill: var(--card); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mm-node.cur text { fill: #1c1915; } }
:root[data-theme="dark"] .mm-node.cur text { fill: #1c1915; }
.mm-node.cur text.n { fill: var(--card); opacity: .8; }
.mm-node { cursor: pointer; }
.mm-node:hover rect { stroke-width: 2.4; }
.mm-cap { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }

.lesson-body { margin-top: 36px; display: flex; flex-direction: column; gap: 20px; font-size: 17px; line-height: 1.7; }
.lesson-body h2 { font-size: 27px; margin-top: 14px; }
.lesson-body ul { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 8px; }
.lesson-body li::marker { color: var(--ember); }
.callout { border-left: 3px solid var(--ember); background: var(--card); padding: 14px 18px; border-radius: 0 10px 10px 0; font-size: 15.5px; line-height: 1.6; }
.callout.warn { border-left-color: var(--steel); }
.callout .ct { font-family: var(--f-display); font-size: 19px; margin-bottom: 4px; }
.code { border-radius: 12px; overflow: hidden; background: var(--code); color: var(--code-fg); }
.code .cap { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--code-line); font-family: var(--f-mono); font-size: 12.5px; color: var(--code-dim); flex-wrap: wrap; }
.code .cap button, .code .cap a { color: var(--code-dim); background: none; border: 1px solid var(--code-line); border-radius: 6px; padding: 3px 8px; font-size: 12px; text-decoration: none; font-family: var(--f-mono); }
.code .cap button:hover, .code .cap a:hover { color: var(--code-fg); border-color: var(--code-dim); }
.code .acts { display: flex; gap: 6px; }
.code pre { margin: 0; padding: 16px 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.65; }
.code .out { border-top: 1px dashed var(--code-line); }
.code .out .lbl { padding: 8px 18px 0; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--code-dim); }
.code .out pre { color: var(--code-str); padding-top: 6px; }
.figcap { font-size: 14px; color: var(--muted); margin-top: -10px; }
.k { color: var(--code-key); } .s { color: var(--code-str); } .c { color: var(--code-dim); font-style: italic; }
.y { color: var(--code-ty); } .n { color: var(--code-num); } .m { color: var(--code-mac); } .l { color: var(--code-key); font-style: italic; }

.pick { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 16px; margin: 0; }
.pick legend { font-family: var(--f-display); font-size: 20px; padding: 0 4px; }
.pick .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
@media (max-width: 680px) { .pick .opts { grid-template-columns: minmax(0, 1fr); } }
.pick label { display: block; cursor: pointer; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code); min-width: 0; }
.pick label .h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-family: var(--f-mono); font-size: 12px; color: var(--code-dim); }
.pick input { accent-color: var(--ember); }
.pick label pre { margin: 0; padding: 10px 12px 12px; font-size: 12.5px; line-height: 1.6; color: var(--code-fg); overflow-x: auto; }
.pick label.right { border-color: var(--ok); }
.pick label.wrong { border-color: var(--ember); }
.pick .res { margin-top: 12px; font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
.pick .res b { color: var(--ink); font-weight: 500; }
.err { margin-top: 8px; font-family: var(--f-mono); font-size: 12.5px; background: var(--paper-2); border-left: 3px solid var(--ember); padding: 6px 10px; border-radius: 0 6px 6px 0; overflow-x: auto; white-space: pre; color: var(--ink); }

/* Animated figures */
.fig { border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; margin: 0; }
.fig-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); }
.fig-h .label { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ember); }
.fig-ctl { display: flex; gap: 4px; align-items: center; }
.fig-ctl button { min-width: 34px; height: 32px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; font-size: 13px; padding: 0 8px; }
.fig-ctl button:hover { border-color: var(--ink); }
.fig-ctl .ct { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { padding: 10px 16px 14px; font-size: 15px; line-height: 1.55; color: var(--ink-soft); min-height: 3.4em; border-top: 1px solid var(--line); }
.fig .dots { display: flex; gap: 4px; padding: 0 16px 12px; }
.fig .dots i { width: 18px; height: 3px; border-radius: 2px; background: var(--line); }
.fig .dots i.on { background: var(--ember); }
.fg-mv { transition: transform .7s cubic-bezier(.45,.05,.2,1), opacity .5s; }
.fig.snap .fg-mv, .fig.snap .fg-mv * { transition: none !important; }
.fg-box { fill: var(--paper); stroke: var(--ink-soft); stroke-width: 1.4; }
.fg-soft { fill: var(--paper-2); stroke: var(--line); stroke-width: 1.2; }
.fg-t { font-family: var(--f-sans); font-size: 14px; fill: var(--ink); }
.fg-tm { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.fg-tb { font-family: var(--f-mono); font-size: 13px; fill: var(--ink); font-weight: 500; }
.fg-tok circle, .fg-tok rect { fill: var(--steel-soft); stroke: var(--steel); stroke-width: 1.6; transition: fill .4s, stroke .4s; }
.fg-tok text { font-family: var(--f-mono); font-size: 12px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.fg-tok.hot circle, .fg-tok.hot rect { fill: var(--ember); stroke: var(--ember); }
.fg-tok.hot text { fill: var(--card); }
.fg-tok.wait circle, .fg-tok.wait rect { stroke: var(--ember); stroke-dasharray: 4 3; }
.fg-tok.dim { opacity: .45; }
.fg-arrow { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke .4s; }
.fg-arrow.on { stroke: var(--ember); }
.fg-line { fill: none; stroke: var(--line); stroke-width: 1.5; }
.fg-flash { transition: fill .4s; }
.fg-flash.on { fill: var(--ember-soft); }
.fg-cell { fill: var(--paper); stroke: var(--line); stroke-width: 1; transition: fill .35s, stroke .35s; }
.fg-cell.pt { fill: var(--steel-soft); stroke: var(--steel); }
.fg-cell.fetched { fill: var(--ember-soft); }
.fg-cell.pt.fetched { fill: var(--amber); stroke: var(--ember); }
.fg-cell.cur, .fg-cell.pt.cur, .fg-cell.pt.fetched.cur { fill: var(--ember); stroke: var(--ember); }
.fg-bar { fill: var(--ember); transition: transform .7s cubic-bezier(.45,.05,.2,1), opacity .4s; transform-box: fill-box; transform-origin: left center; }
.fg-late { fill: var(--ember); }
:root[data-theme="dark"] .fg-tok.hot text { fill: #1c1915; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fg-tok.hot text { fill: #1c1915; } }

.links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; }
.links a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 4px; font-weight: 500; }
.links span { color: var(--muted); }

.why { margin-top: 48px; background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--ember); border-radius: 0 0 14px 14px; padding: 22px 22px 8px; }
.why h2 { font-size: 28px; }
.why .sub { font-size: 14.5px; color: var(--muted); margin-top: 4px; }
.why dl { margin: 16px 0 0; }
.why dt { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ember); padding-top: 14px; border-top: 1px solid var(--line); }
.why dt:first-child { border-top: 0; padding-top: 0; }
.why dd { margin: 6px 0 14px; font-size: 16.5px; line-height: 1.65; color: var(--ink-soft); }

.check { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 32px; }
.check h2 { font-size: 32px; }
.check .st { margin-top: 6px; color: var(--ink-soft); }
.qs { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 32px; }
.qmeta { display: flex; gap: 10px; align-items: center; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.tag { border-radius: 999px; padding: 1px 9px; font-size: 11.5px; border: 1px solid var(--line); color: var(--ink-soft); }
.tag.why { border-color: var(--ember); color: var(--ember); }
.qp { font-family: var(--f-display); font-size: 21px; margin-top: 6px; }
.choices { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
.choices button { display: flex; gap: 12px; align-items: flex-start; width: 100%; min-height: 46px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; font-size: 16px; line-height: 1.45; }
.choices button:hover:not([disabled]) { border-color: var(--ink); }
.choices button .L { font-family: var(--f-mono); font-size: 14px; color: var(--ember); flex: none; padding-top: 1px; }
.choices button.sel-right { border-color: var(--ok); background: var(--ok-soft); }
.choices button.sel-wrong { border-color: var(--ember); }
.choices button[disabled] { cursor: default; }
.fb { margin-top: 10px; font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
.fb b { color: var(--ink); font-weight: 500; }
.done-note { margin-top: 24px; padding: 14px 18px; border-radius: 10px; background: var(--ember-soft); color: var(--ink); }
.pager { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; background: var(--card); min-width: 0; }
.pager a:hover { border-color: var(--ink); }
.pager .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.pager .t { font-family: var(--f-display); font-size: 19px; display: block; margin-top: 2px; }
.pager .nx { text-align: right; grid-column: 2; }

.ref h1 { font-size: clamp(32px, 5vw, 46px); margin-top: 8px; }
.ref .lede { margin-top: 12px; }
.terms { margin-top: 28px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.term { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; }
.term h2 { font-size: 20px; }
.term p { color: var(--ink-soft); font-size: 15.5px; }
.term a { font-size: 13.5px; color: var(--muted); }
@media (max-width: 600px) { .term { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.filter { margin-top: 22px; width: 100%; max-width: 360px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 14px; font: inherit; color: var(--ink); }
.sheet { margin-top: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .sheet { grid-template-columns: minmax(0, 1fr); } }
.sheet section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sheet h2 { font-size: 20px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sheet td { padding: 8px 16px; border-top: 1px solid var(--line); vertical-align: top; }
.sheet tr:first-child td { border-top: 0; }
.sheet td:first-child { font-family: var(--f-mono); font-size: 12.5px; color: var(--ember-deep); width: 50%; overflow-wrap: anywhere; }
.errs { margin-top: 28px; display: flex; flex-direction: column; gap: 20px; }
.errcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.errcard .code-id { font-family: var(--f-mono); color: var(--ember); font-size: 14px; }
.errcard h2 { font-size: 23px; margin-top: 2px; }
.errcard p { margin-top: 10px; color: var(--ink-soft); font-size: 15.5px; }
.errcard p b { color: var(--ink); font-weight: 500; }
.bf { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .bf { grid-template-columns: minmax(0, 1fr); } }
.bf .code pre { font-size: 12.5px; padding: 12px 14px; }
footer { border-top: 1px solid var(--line); padding-block: 28px; font-size: 14px; color: var(--muted); }
footer p + p { margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 40; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
const CODE = {"a01": "use std::thread;\n\nfn main() {\n    let handle = thread::spawn(|| {\n        let sum: u64 = (1..=1_000_000).sum();\n        sum // the thread's return value\n    });\n    let sum = handle.join().unwrap(); // wait for it, and take the value\n    println!(\"sum = {sum}\");\n\n    let words = vec![\"patina\", \"temper\", \"anneal\", \"forge\"];\n    let total = thread::scope(|s| {\n        let a = s.spawn(|| words[..2].iter().map(|w| w.len()).sum::<usize>());\n        let b = s.spawn(|| words[2..].iter().map(|w| w.len()).sum::<usize>());\n        a.join().unwrap() + b.join().unwrap()\n    }); // every scoped thread has finished here\n    println!(\"{} letters in {:?}\", total, words);\n}\n", "a02": "use std::cell::RefCell;\nuse std::sync::{Arc, Mutex};\n\nfn is_send<T: Send>() {}\nfn is_sync<T: Sync>() {}\n\nfn main() {\n    is_send::<Arc<String>>();\n    is_sync::<Arc<String>>();\n    is_send::<RefCell<u32>>();       // may move to another thread\n    // is_sync::<RefCell<u32>>();    // may not be shared: error[E0277]\n    is_sync::<Mutex<Vec<u32>>>();    // Mutex makes shared access safe\n    // is_send::<std::rc::Rc<u32>>(); // error[E0277]\n    println!(\"every check passed, at compile time\");\n}\n", "a03": "use std::sync::{Arc, Mutex, RwLock};\nuse std::thread;\n\nfn main() {\n    let config = Arc::new(RwLock::new(String::from(\"v1\")));\n    let hits = Arc::new(Mutex::new(0u32));\n\n    let mut handles = Vec::new();\n    for i in 0..4 {\n        let config = Arc::clone(&config);\n        let hits = Arc::clone(&hits);\n        handles.push(thread::spawn(move || {\n            let version = config.read().unwrap().clone(); // many readers at once\n            *hits.lock().unwrap() += 1;                   // one writer at a time\n            format!(\"worker {i} saw {version}\")\n        }));\n    }\n    for h in handles {\n        println!(\"{}\", h.join().unwrap());\n    }\n\n    *config.write().unwrap() = String::from(\"v2\"); // waits until no reader holds it\n    println!(\"hits = {}, config = {}\", hits.lock().unwrap(), config.read().unwrap());\n}\n", "a04": "use std::sync::mpsc;\nuse std::thread;\n\nenum Command {\n    Add(u32),\n    Get(mpsc::Sender<u32>),\n}\n\nfn main() {\n    let (tx, rx) = mpsc::channel::<Command>();\n\n    // One thread owns the total. Nobody else can touch it, so no lock.\n    let owner = thread::spawn(move || {\n        let mut total = 0;\n        for cmd in rx {\n            match cmd {\n                Command::Add(n) => total += n,\n                Command::Get(reply) => reply.send(total).unwrap(),\n            }\n        }\n        total // the loop ends when every Sender is dropped\n    });\n\n    let workers: Vec<_> = (1..=3)\n        .map(|i| {\n            let tx = tx.clone();\n            thread::spawn(move || tx.send(Command::Add(i * 10)).unwrap())\n        })\n        .collect();\n    for w in workers {\n        w.join().unwrap();\n    }\n\n    let (reply_tx, reply_rx) = mpsc::channel();\n    tx.send(Command::Get(reply_tx)).unwrap();\n    println!(\"total so far: {}\", reply_rx.recv().unwrap());\n\n    drop(tx); // the last Sender: the owner's loop can end\n    println!(\"owner finished with {}\", owner.join().unwrap());\n}\n", "a05": "use std::sync::Arc;\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::thread;\n\nfn run(correct: bool) -> u64 {\n    let count = Arc::new(AtomicU64::new(0));\n    let handles: Vec<_> = (0..8)\n        .map(|_| {\n            let count = Arc::clone(&count);\n            thread::spawn(move || {\n                for _ in 0..100_000 {\n                    if correct {\n                        count.fetch_add(1, Ordering::Relaxed); // one indivisible step\n                    } else {\n                        let n = count.load(Ordering::Relaxed); // read...\n                        count.store(n + 1, Ordering::Relaxed); // ...then write: another thread can slip in between\n                    }\n                }\n            })\n        })\n        .collect();\n    for h in handles {\n        h.join().unwrap();\n    }\n    count.load(Ordering::Relaxed)\n}\n\nfn main() {\n    println!(\"fetch_add:    {}\", run(true));\n    println!(\"load + store: {}\", run(false));\n}\n", "a06": "use std::hint::black_box;\nuse std::sync::{Arc, Mutex};\nuse std::thread;\nuse std::time::Instant;\n\nconst TOTAL: u64 = 8_000_000;\nconst THREADS: u64 = 8;\n\nfn main() {\n    // One shared counter behind one lock: every increment waits its turn.\n    let start = Instant::now();\n    let shared = Arc::new(Mutex::new(0u64));\n    let handles: Vec<_> = (0..THREADS)\n        .map(|_| {\n            let shared = Arc::clone(&shared);\n            thread::spawn(move || {\n                for _ in 0..TOTAL / THREADS {\n                    *shared.lock().unwrap() += 1;\n                }\n            })\n        })\n        .collect();\n    for h in handles {\n        h.join().unwrap();\n    }\n    println!(\"one lock:      {} in {} ms\", shared.lock().unwrap(), start.elapsed().as_millis());\n\n    // Each thread counts on its own, then the results are merged once.\n    let start = Instant::now();\n    let handles: Vec<_> = (0..THREADS)\n        .map(|_| {\n            thread::spawn(|| {\n                let mut local = 0u64;\n                for _ in 0..TOTAL / THREADS {\n                    local = black_box(local + 1);\n                }\n                local\n            })\n        })\n        .collect();\n    let sum: u64 = handles.into_iter().map(|h| h.join().unwrap()).sum();\n    println!(\"local + merge: {} in {} ms\", sum, start.elapsed().as_millis());\n}\n", "b07": "use std::future::Future;\nuse std::pin::Pin;\nuse std::task::{Context, Poll};\n\nstruct Countdown(u32);\n\nimpl Future for Countdown {\n    type Output = &'static str;\n\n    fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {\n        if self.0 == 0 {\n            Poll::Ready(\"liftoff\")\n        } else {\n            println!(\"poll: {} left, returning Pending\", self.0);\n            self.0 -= 1;\n            cx.waker().wake_by_ref(); // \"poll me again soon\"\n            Poll::Pending\n        }\n    }\n}\n\nasync fn small() {\n    tokio::task::yield_now().await;\n}\n\nasync fn big() {\n    let buf = [0u8; 4096]; // lives across the .await, so it is stored in the future\n    tokio::task::yield_now().await;\n    println!(\"{}\", buf.len());\n}\n\n#[tokio::main]\nasync fn main() {\n    let out = Countdown(3).await;\n    println!(\"{out}\");\n\n    println!(\"small(): {} bytes\", std::mem::size_of_val(&small()));\n    println!(\"big():   {} bytes\", std::mem::size_of_val(&big()));\n}\n", "b08": "use std::time::{Duration, Instant};\n\n#[tokio::main]\nasync fn main() {\n    let start = Instant::now();\n    let mut handles = Vec::new();\n    for id in 0..10_000u64 {\n        // Each spawn is a task: a future handed to the runtime to drive.\n        handles.push(tokio::spawn(async move {\n            tokio::time::sleep(Duration::from_millis(50)).await;\n            id * 2\n        }));\n    }\n    let mut sum = 0;\n    for h in handles {\n        sum += h.await.unwrap(); // JoinHandle: wait for the task's result\n    }\n    println!(\"10,000 tasks, sum = {sum}, in {} ms\", start.elapsed().as_millis());\n}\n", "b09": "use std::time::{Duration, Instant};\n\n// A task that wants to run every 50 ms. Returns the worst gap it saw.\nasync fn ticker() -> u128 {\n    let mut last = Instant::now();\n    let mut worst = 0;\n    for _ in 0..6 {\n        tokio::time::sleep(Duration::from_millis(50)).await;\n        worst = worst.max(last.elapsed().as_millis());\n        last = Instant::now();\n    }\n    worst\n}\n\n#[tokio::main(flavor = \"current_thread\")] // one thread, to make the effect obvious\nasync fn main() {\n    let tick = tokio::spawn(ticker());\n    tokio::time::sleep(Duration::from_millis(10)).await;\n    tokio::spawn(async {\n        std::thread::sleep(Duration::from_millis(200)); // blocks the only thread\n    })\n    .await\n    .unwrap();\n    println!(\"blocking in a task:  worst gap {} ms\", tick.await.unwrap());\n\n    let tick = tokio::spawn(ticker());\n    tokio::time::sleep(Duration::from_millis(10)).await;\n    tokio::task::spawn_blocking(|| {\n        std::thread::sleep(Duration::from_millis(200)); // runs on a separate thread pool\n    })\n    .await\n    .unwrap();\n    println!(\"spawn_blocking:      worst gap {} ms\", tick.await.unwrap());\n}\n", "b10": "use std::time::Duration;\nuse tokio::time::{sleep, timeout};\n\nstruct Cleanup(&'static str);\n\nimpl Drop for Cleanup {\n    fn drop(&mut self) {\n        println!(\"  drop: {}\", self.0);\n    }\n}\n\nasync fn slow_query() -> &'static str {\n    let _guard = Cleanup(\"query state released\");\n    sleep(Duration::from_millis(500)).await;\n    \"rows\"\n}\n\n#[tokio::main]\nasync fn main() {\n    match timeout(Duration::from_millis(100), slow_query()).await {\n        Ok(rows) => println!(\"got {rows}\"),\n        Err(_) => println!(\"timeout: gave up after 100 ms\"),\n    }\n\n    tokio::select! {\n        rows = slow_query() => println!(\"got {rows}\"),\n        _ = sleep(Duration::from_millis(100)) => println!(\"select: the timer won\"),\n    }\n}\n", "b11": "use std::time::{Duration, Instant};\nuse tokio::sync::mpsc;\n\n#[tokio::main]\nasync fn main() {\n    let start = Instant::now();\n    let ms = move || start.elapsed().as_millis() / 10 * 10; // rounded to 10 ms\n    let (tx, mut rx) = mpsc::channel::<u32>(2); // room for two jobs\n\n    let producer = tokio::spawn(async move {\n        for job in 1..=5 {\n            tx.send(job).await.unwrap(); // waits while the channel is full\n            println!(\"{:>4} ms  sent {job}\", ms());\n        }\n    });\n\n    while let Some(job) = rx.recv().await {\n        tokio::time::sleep(Duration::from_millis(100)).await; // a slow consumer\n        println!(\"{:>4} ms    handled {job}\", ms());\n    }\n    producer.await.unwrap();\n}\n", "b12": "use std::time::Duration;\nuse tokio::task::JoinSet;\nuse tokio::time::sleep;\nuse tokio_util::sync::CancellationToken;\n\nasync fn worker(id: u32, token: CancellationToken) -> String {\n    let mut jobs = 0;\n    loop {\n        tokio::select! {\n            _ = token.cancelled() => break,       // stop between jobs\n            _ = sleep(Duration::from_millis(60)) => jobs += 1, // one job\n        }\n    }\n    format!(\"worker {id} stopped after {jobs} jobs\")\n}\n\n#[tokio::main]\nasync fn main() {\n    let token = CancellationToken::new();\n    let mut workers = JoinSet::new();\n    for id in 1..=3 {\n        workers.spawn(worker(id, token.clone()));\n    }\n\n    // In a real service: tokio::signal::ctrl_c().await\n    sleep(Duration::from_millis(200)).await;\n    println!(\"shutdown signal\");\n    token.cancel();\n\n    let mut reports: Vec<String> = Vec::new();\n    while let Some(done) = workers.join_next().await {\n        reports.push(done.unwrap());\n    }\n    reports.sort();\n    for r in reports {\n        println!(\"{r}\");\n    }\n    println!(\"all workers finished, exiting\");\n}\n", "c13": "use std::mem::{align_of, size_of};\n\n#[allow(dead_code)]\nstruct Loose {\n    a: u8,\n    b: u32,\n    c: u8,\n}\n\n#[allow(dead_code)]\n#[repr(C)] // C layout: fields stay in the written order\nstruct InOrder {\n    a: u8,\n    b: u32,\n    c: u8,\n}\n\nfn main() {\n    println!(\"Loose:   size {:>2}, align {}\", size_of::<Loose>(), align_of::<Loose>());\n    println!(\"InOrder: size {:>2}, align {}\", size_of::<InOrder>(), align_of::<InOrder>());\n    println!(\"u64:               {:>2}\", size_of::<u64>());\n    println!(\"Option<u64>:       {:>2}\", size_of::<Option<u64>>());\n    println!(\"Box<u64>:          {:>2}\", size_of::<Box<u64>>());\n    println!(\"Option<Box<u64>>:  {:>2}\", size_of::<Option<Box<u64>>>());\n    println!(\"&str:              {:>2}\", size_of::<&str>());\n    println!(\"String / Vec<u8>:  {:>2}\", size_of::<String>());\n}\n", "c14": "use std::alloc::{GlobalAlloc, Layout, System};\nuse std::fmt::Write;\nuse std::sync::atomic::{AtomicUsize, Ordering::Relaxed};\n\n// Wraps the system allocator and counts every allocation.\nstruct Counting;\nstatic ALLOCS: AtomicUsize = AtomicUsize::new(0);\n\nunsafe impl GlobalAlloc for Counting {\n    unsafe fn alloc(&self, layout: Layout) -> *mut u8 {\n        ALLOCS.fetch_add(1, Relaxed);\n        unsafe { System.alloc(layout) }\n    }\n    unsafe fn dealloc(&self, ptr: *mut u8, layout: Layout) {\n        unsafe { System.dealloc(ptr, layout) }\n    }\n}\n\n#[global_allocator]\nstatic GLOBAL: Counting = Counting;\n\nfn allocations(f: impl FnOnce()) -> usize {\n    let before = ALLOCS.load(Relaxed);\n    f();\n    ALLOCS.load(Relaxed) - before\n}\n\nfn main() {\n    let grow = allocations(|| {\n        let mut v = Vec::new();\n        for i in 0..1000 {\n            v.push(i); // the buffer grows by doubling, copying each time\n        }\n    });\n    let sized = allocations(|| {\n        let mut v = Vec::with_capacity(1000);\n        for i in 0..1000 {\n            v.push(i);\n        }\n    });\n    let fresh = allocations(|| {\n        for i in 0..1000 {\n            let line = format!(\"GET /notes/{i}\"); // a new String every time\n            std::hint::black_box(&line);\n        }\n    });\n    let reused = allocations(|| {\n        let mut line = String::with_capacity(32);\n        for i in 0..1000 {\n            line.clear(); // keeps the capacity\n            write!(line, \"GET /notes/{i}\").unwrap();\n            std::hint::black_box(&line);\n        }\n    });\n    println!(\"Vec::new + 1000 pushes:      {grow} allocations\");\n    println!(\"Vec::with_capacity(1000):    {sized}\");\n    println!(\"format! 1000 times:          {fresh}\");\n    println!(\"one String, cleared, reused: {reused}\");\n}\n", "c15": "use std::hint::black_box;\nuse std::time::Instant;\n\n#[derive(Clone, Copy)]\nstruct Point {\n    x: f64,\n    y: f6 uare(1.0), Square(2.0)];\n    let mixed: Vec<Box<dyn Shape>> = vec![Box::new(Square(1.0)), Box::new(Circle(1.0))];\n    println!(\"generic, squares only: {}\", total_generic(&squares));\n    println!(\"dyn, mixed:            {:.2}\", total_dyn(&mixed));\n    println!(\"&Square:     {} bytes\", size_of::<&Square>());\n    println!(\"&dyn Shape:  {} bytes (data pointer + vtable pointer)\", size_of::<&dyn Shape>());\n}\n", "c17": "use std::hint::black_box;\nuse std::time::Instant;\n\nfn sum_of_squares(n: u64) -> u64 {\n    (0..n).map(|x| x * x % 7).sum()\n}\n\nfn main() {\n    let t = Instant::now();\n    let r = sum_of_squares(black_box(50_000_000)); // black_box: the optimizer can't precompute it\n    println!(\"result {r} in {} ms\", t.elapsed().as_millis());\n}\n", "d18": "/// Split one mutable slice into two that do not overlap.\nfn split_halves(v: &mut [u32]) -> (&mut [u32], &mut [u32]) {\n    let mid = v.len() / 2;\n    let ptr = v.as_mut_ptr();\n    // SAFETY: `ptr` is valid for `v.len()` elements. The two ranges\n    // [0, mid) and [mid, len) do not overlap, so the two &mut never alias,\n    // and both borrow from `v`, so they cannot outlive it.\n    unsafe {\n        (\n            std::slice::from_raw_parts_mut(ptr, mid),\n            std::slice::from_raw_parts_mut(ptr.add(mid), v.len() - mid),\n        )\n    }\n}\n\nfn main() {\n    let mut data = [1, 2, 3, 4, 5, 6];\n    let (left, right) = split_halves(&mut data);\n    left[0] = 10;\n    right[0] = 40;\n    println!(\"{data:?}\");\n\n    // The standard library already provides this, safely wrapped:\n    let (a, b) = data.split_at_mut(3);\n    a[1] += b[1];\n    println!(\"{data:?}\");\n}\n", "d19": "use std::ffi::{CString, c_char, c_int};\n\n// Functions from the C standard library, which every Rust program on Linux links.\nunsafe extern \"C\" {\n    safe fn abs(x: c_int) -> c_int;              // takes a number: nothing can go wrong\n    fn strlen(s: *const c_char) -> usize;        // takes a raw pointer: unsafe to call\n}\n\n/// A safe wrapper: the only way in is a Rust &str.\nfn c_len(text: &str) -> usize {\n    let c = CString::new(text).expect(\"no NUL bytes inside\");\n    // SAFETY: `c` is a valid, NUL-terminated string that lives until the call returns.\n    unsafe { strlen(c.as_ptr()) }\n}\n\nfn main() {\n    println!(\"abs(-42) = {}\", abs(-42));\n    println!(\"strlen(\\\"anneal\\\") = {}\", c_len(\"anneal\"));\n}\n", "before_list": "#[derive(Clone)]\nstruct AppState {\n    notes: Arc<Mutex<Vec<Note>>>,\n}\n\nasync fn list_notes(State(state): State<AppState>) -> Json<Vec<Note>> {\n    let notes = state.notes.lock().expect(\"notes lock\");\n    Json(notes.clone()) // 2,000 notes copied, lock held the whole time\n}\n", "after_list": "#[derive(Clone)]\nstruct AppState {\n    notes: Arc<RwLock<Arc<Vec<Note>>>>,\n}\n\nasync fn list_notes(State(state): State<AppState>) -> Json<Arc<Vec<Note>>> {\n    let snapshot = state.notes.read().expect(\"notes lock\").clone(); // clones the Arc, not the notes\n    Json(snapshot) // the lock is already released here\n}\n\nasync fn create_note(\n    State(state): State<AppState>,\n    Json(new_note): Json<NewNote>,\n) -> (StatusCode, Json<Note>) {\n    let mut notes = state.notes.write().expect(\"notes lock\");\n    let note = Note { id: notes.len() as u64 + 1, title: new_note.title, body: new_note.body };\n    Arc::make_mut(&mut notes).push(note.clone()); // copies the Vec only if a reader still holds the old snapshot\n    (StatusCode::CREATED, Json(note))\n}\n"};

const GLOSSARY = [
  { name: "Arc", body: "Atomically reference-counted pointer: shared ownership across threads. The last owner frees the value. Gives read access only.", lesson: "locks" },
  { name: "Atomic", body: "A type such as `AtomicU64` whose operations the CPU performs as one indivisible step, shared without a lock.", lesson: "atomics" },
  { name: "Backpressure", body: "Making a fast producer wait when a consumer falls behind, usually with a bounded channel, instead of letting a queue grow without limit.", lesson: "backpressure" },
  { name: "Cache line", body: "The block of memory (commonly 64 bytes) the CPU fetches at once. Data side by side shares lines; scattered data does not.", lesson: "locality" },
  { name: "CancellationToken", body: "From tokio-util. A shared signal: `cancel()` once, and every `cancelled()` future completes.", lesson: "shutdown" },
  { name: "Cancellation", body: "Stopping async work by dropping its future. It stops at the `.await` it was parked on, and destructors run.", lesson: "cancellation" },
  { name: "Contention", body: "Many threads wanting the same lock at once, so most of them wait. Correct, but slow.", lesson: "contention" },
  { name: "Copy-on-write", body: "Share one value until someone changes it; then copy it first. `Arc::make_mut` does this.", lesson: "under-load" },
  { name: "Data race", body: "Two threads accessing the same memory at once, at least one writing, with no synchronisation. Impossible in safe Rust.", lesson: "send-sync" },
  { name: "Deadlock", body: "Threads waiting for each other's locks forever. Not prevented by the compiler; avoided by a consistent lock order.", lesson: "contention" },
  { name: "Executor", body: "The part of an async runtime that polls futures, parks them on `Pending`, and polls them again when woken.", lesson: "futures" },
  { name: "FFI", body: "Foreign function interface: calling code written in another language, usually C, through `extern` declarations.", lesson: "ffi" },
  { name: "Future", body: "A value implementing `Future`: a state machine that is polled until it returns `Ready`. Does nothing until polled.", lesson: "futures" },
  { name: "JoinHandle", body: "Returned by `thread::spawn` or `tokio::spawn`. Waiting on it gives the result of the thread or task.", lesson: "threads" },
  { name: "JoinSet", body: "A Tokio collection of spawned tasks. `join_next()` waits for them one at a time.", lesson: "shutdown" },
  { name: "Monomorphisation", body: "Compiling a separate copy of generic code for each concrete type, so calls are direct.", lesson: "dispatch" },
  { name: "Mutex", body: "Lets one holder at a time reach the data inside. `lock()` returns a guard; dropping the guard unlocks.", lesson: "locks" },
  { name: "Niche", body: "An impossible value of a type (such as a null Box) that Rust reuses to store an enum's tag, so `Option<Box<T>>` costs nothing extra.", lesson: "layout" },
  { name: "Padding", body: "Unused bytes the compiler inserts so each field starts at an address its alignment allows.", lesson: "layout" },
  { name: "Pin", body: "A type promising that a value will not move in memory. Futures need it because they may point into themselves.", lesson: "futures" },
  { name: "Poisoning", body: "A std lock is marked poisoned when a thread panics while holding it; later `lock()` calls return `Err`.", lesson: "locks" },
  { name: "Race condition", body: "Logic whose result depends on timing, such as a separate load and store. Safe Rust allows these.", lesson: "atomics" },
  { name: "RwLock", body: "A lock that allows many readers or one writer at a time.", lesson: "locks" },
  { name: "Scoped thread", body: "A thread started in `thread::scope`. It is guaranteed to finish before the scope ends, so it may borrow local data.", lesson: "threads" },
  { name: "select!", body: "Tokio macro that waits on several futures and runs the branch of the first to finish. The others are dropped.", lesson: "cancellation" },
  { name: "Send", body: "Marker trait: a value of this type may move to another thread.", lesson: "send-sync" },
  { name: "spawn_blocking", body: "Runs a blocking closure on Tokio's separate pool, so async worker threads stay free.", lesson: "blocking" },
  { name: "Sync", body: "Marker trait: `&T` may be shared between threads. `T: Sync` exactly when `&T: Send`.", lesson: "send-sync" },

  { name: "Undefined behaviour", body: "An operation the language gives no meaning to, such as a dangling read or a data race. Only possible through `unsafe`.", lesson: "unsafe" },
  { name: "unsafe", body: "Marks code where you uphold rules the compiler cannot check, such as dereferencing raw pointers or calling C.", lesson: "unsafe" },
  { name: "vtable", body: "A table of method pointers carried by a trait object, used to find the right method at runtime.", lesson: "dispatch" },

const figState = {};
let figObserver = null;
function figHtml(id, key) {

function figApply(el, instant) {
  const id = el.dataset.fig, F = FIG[id], st = figState[el.dataset.key];
  const fr = F.frames[st.i];
  if (instant) el.classList.add("snap");
  Object.entries(fr.set).forEach(([k, v]) => {
    const node = el.querySelector('[data-k="' + k + '"]'); if (!node) return;
    if (v.xy) node.style.transform = "translate(" + v.xy[0] + "px," + v.xy[1] + "px)";
    if (v.o !== undefined) node.style.opacity = v.o;
    if (v.t !== undefined) node.textContent = v.t;
    if (v.c) Object.entries(v.c).forEach(([c, on]) => node.classList.toggle(c, !!on));
  });
  if (instant) { void el.offsetWidth; el.classList.remove("snap"); }
  el.querySelector("figcaption").innerHTML = rich(fr.cap);
  el.querySelector(".ct").textContent = (st.i + 1) + " / " + F.frames.length;
  el.querySelectorAll(".dots i").forEach((d, j) => d.classList.toggle("on", j <= st.i));
  const play = el.querySelector('[data-act="fig-play"]');
  play.textContent = st.playing ? "❚❚" : "▶"; play.setAttribute("aria-label", st.playing ? "Pause animation" : "Play animation");
  el.querySelector("figcaption").setAttribute("aria-live", st.playing ? "off" : "polite");
}
function figTick(el) {
  const st = figState[el.dataset.key]; clearTimeout(st.t);
  if (!st.playing || !st.visible) return;
  const F = FIG[el.dataset.fig], last = st.i === F.frames.length - 1;
  st.t = setTimeout(() => { st.i = last ? 0 : st.i + 1; figApply(el, last); figTick(el); }, (F.ms || 1900) * (last ? 1.8 : 1) + (st.i === 0 ? 400 : 0));
}
function setupFigures() {
  if (figObserver) figObserver.disconnect();
  figObserver = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
    const st = figState[e.target.dataset.key]; if (!st) return;
    st.visible = e.isIntersecting; figTick(e.target);
  }), { threshold: 0.5 }) : null;
  document.querySelectorAll(".fig").forEach(el => {
    const key = el.dataset.key;
    if (!figState[key]) figState[key] = { i: 0, playing: !REDUCED, visible: !figObserver };
    figApply(el, true);
    if (figObserver) figObserver.observe(el); else figTick(el);
  });
}

      "Patina taught the language. Temper built a web service. Anneal opens the hood: threads and locks, what a future really is, where memory goes, and how to measure. It ends by putting Temper's notes service under load and making it faster.") + "</p>" +
    '<div class="family" aria-label="The course series"><a href="' + OUTSIDE.patina.href + '" target="_blank" rel="noopener noreferrer">Patina ↗</a><span class="arr">→</span><a href="' + OUTSIDE.temper.href + '" target="_blank" rel="noopener noreferrer">Temper ↗</a><span class="arr">→</span><b>Anneal</b></div>' +
    '<div class="start-row">' + (r ? '<a class="btn" href="#l-' + r.slug + '">' + (n === 0 ? "Start with lesson 1" : "Continue · " + esc(r.title)) + " →</a>" : '<a class="btn" href="#sheet">Open the sheet →</a>') +
    '<span class="mono muted" style="font-size:14px">' + n + " of " + LESSONS.length + " complete</span></div>" +
    '<div class="progress" role="progressbar" aria-label="Lessons completed" aria-valuemin="0" aria-valuemax="' + LESSONS.length + '" aria-valuenow="' + n + '"><i style="width:' + (100 * n / LESSONS.length) + '%"></i></div>' +
    '<p class="qcount">Questions right: <b>' + kc.what[0] + "/" + kc.what[1] + "</b> on what an idea is · <b>" + kc.why[0] + "/" + kc.why[1] + "</b> on why it exists</p></section>" +
    '<section class="mapsec" aria-labelledby="map-h"><div class="mapsec-head"><h2 id="map-h">The map</h2><div class="legend"><span><i></i>not yet</span><span><i class="n"></i>ready</span><span><i class="d"></i>done</span><span>Heat flows from what you know to what it unlocks.</span></div></div>' +
    '<div class="mapgrid">' + viewMap() + "</div></section>" +
    '<section class="path" aria-labelledby="path-h"><h2 id="path-h">The lessons, in order</h2>' +
    TRACKS.map(t => '<div class="track"><h3>' + esc(t.title) + " <span>· " + esc(t.summary) + '</span></h3><ul class="lessons">' + LESSONS.filter(l => l.track === t.id).map(l =>
      '<li class="' + (isDone(l.slug) ? "done" : "") + '"><a href="#l-' + l.slug + '"><span class="num">' + pad(l.number) + '</span><span class="body"><span class="t">' + esc(l.title) + '</span><span class="s">' + rich(l.summary) + '</span></span><span class="min">' + l.minutes + ' min</span><span class="tick" aria-label="' + (isDone(l.slug) ? "Done" : "Not done") + '">✓</span></a></li>').join("") + "</ul></div>").join("") + "</section>" +
    (started ? '<div class="reset">' + (armed ? "<span>This clears every answer on this device" + (remote ? " and in your account" : "") + '.</span><button class="btn sm" data-act="reset-yes">Clear progress</button><button class="btn sm quiet" data-act="reset-no">Keep it</button>' : '<button class="btn sm quiet" data-act="reset">Reset progress</button>') + "</div>" : "") +
    "</div></main>";
}
function codeBlock(b, idx) {
  const std = (b.lang || "rust") === "rust" && /fn main/.test(b.code) && !/tokio|axum|serde/.test(b.code);
  const pg = std ? "https://play.rust-lang.org/?version=stable&mode=release&edition=2024&code=" + encodeURIComponent(b.code) : null;
  return '<div class="code"><div class="cap"><span>' + esc(b.file || (b.lang === "plain" ? "" : "src/main.rs")) + '</span><span class="acts"><button data-act="copy" data-i="' + idx + '">Copy</button>' + (pg ? '<a href="' + esc(pg) + '" target="_blank" rel="noopener noreferrer">Open in Playground ↗</a>' : "") + "</span></div>" +
    "<pre><code>" + hl(b.code, b.lang) + "</code></pre>" + (b.out ? '<div class="out"><div class="lbl">Output</div><pre>' + esc(b.out) + "</pre></div>" : "") + "</div>" +
    (b.caption ? '<p class="figcap">' + rich(b.caption) + "</p>" : "");
}
const pickState = {};
function pick(b, idx) {
  const key = R.slug + ":" + idx, p = pickState[key];
  const opt = id => {
    const sel = p === id, cls = sel ? (id === b.answer ? "right" : "wrong") : "";
    return '<label class="' + cls + '"><span class="h"><input type="radio" name="pk-' + idx + '" data-act="pick" data-i="' + idx + '" value="' + id + '"' + (sel ? " checked" : "") + "> " + id.toUpperCase() + "</span><pre><code>" + hl(b[id]) + "</code></pre></label>";
  };
  const wrongId = b.answer === "a" ? "B" : "A";
  return '<fieldset class="pick"><legend>' + rich(b.prompt) + '</legend><div class="opts">' + opt("a") + opt("b") + "</div>" +
    '<div class="res" aria-live="polite">' + (p ? "<b>" + (p === b.answer ? "Yes, this one compiles." : "This one does not compile.") + "</b> Version " + (b.answer === "a" ? "B" : "A") + " fails with:" + '<div class="err">' + esc(b.error) + '</div><p style="margin-top:8px">' + rich(b.why) + "</p>" : '<span class="muted">Pick the version the compiler accepts.</span>') + "</div></fieldset>";
}
function block(b, idx) {
  switch (b.type) {
    case "p": return "<p>" + rich(b.text) + "</p>";
    case "h": return "<h2>" + rich(b.text) + "</h2>";
    case "ul": return "<ul>" + b.items.map(x => "<li>" + rich(x) + "</li>").join("") + "</ul>";
    case "callout": return '<div class="callout' + (b.tone === "warn" ? " warn" : "") + '"><div class="ct">' + rich(b.title) + "</div>" + rich(b.text) + "</div>";
    case "code": return codeBlock(b, idx);
    case "pick": return pick(b, idx);
    case "figure": return figHtml(b.id, R.slug + ":" + idx);
    case "links": return '<ul class="links">' + b.items.map(x => '<li><a href="' + esc(x.href) + '" target="_blank" rel="noopener noreferrer">' + esc(x.label) + " ↗</a> <span>— " + rich(x.note) + "</span></li>").join("") + "</ul>";
  }
  return "";
}
function order(key, n) {
  let h = 2166136261; for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  const idx = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
function quiz(l) {
  const right = l.quiz.filter((q, i) => P.answers[qid(l, i)] === q.answer).length, total = l.quiz.length;
  return '<section class="check" aria-labelledby="check-h"><h2 id="check-h">Check</h2><p class="st">' + (right === total ? "All " + total + " landed. This lesson is marked done, and its node on the map is warm." : right + " of " + total + " correct. Two questions ask what the idea is; one asks why it exists. A wrong answer can be changed.") + "</p>" +
    '<ol class="qs">' + l.quiz.map((q, i) => {
      const a = P.answers[qid(l, i)], ok = a === q.answer;
      return '<li><div class="qmeta"><span>' + (i + 1) + " / " + total + '</span><span class="tag ' + q.kind + '">' + (q.kind === "why" ? "Why it exists" : "What it is") + '</span></div><p class="qp">' + rich(q.prompt) + '</p><ul class="choices">' +
        order(qid(l, i), q.choices.length).map((j, pos) => {
          const sel = a === j;
          return '<li><button data-act="answer" data-q="' + i + '" data-c="' + j + '"' + (ok ? " disabled" : "") + ' class="' + (sel ? (j === q.answer ? "sel-right" : "sel-wrong") : "") + '"' + (sel ? ' aria-pressed="true"' : "") + '><span class="L">' + "ABCD"[pos] + "</span><span>" + rich(q.choices[j]) + "</span></button></li>";
        }).join("") + "</ul>" + (a !== undefined ? '<p class="fb" aria-live="polite"><b>' + (ok ? "Yes." : "Not quite.") + "</b> " + rich(q.why) + "</p>" : "") + "</li>";
    }).join("") + "</ol>" + (right === total ? '<div class="done-note">Done. ' + (l.next.length ? "This unlocks: " + l.next.map(n => '<a class="link" href="#l-' + n + '">' + esc(BY[n].title) + "</a>").join(", ") + "." : "That was the last lesson.") + "</div>" : "") + "</section>";
}
function viewLesson() {
  const l = BY[R.slug], t = TR[l.track];
  const prev = LESSONS[l.number - 2], next = LESSONS[l.number];
  return '<main id="content"><div class="wrap narrow"><div class="lesson-head"><p class="eyebrow">' + pad(l.number) + " · " + esc(t.title) + " · " + l.minutes + " min</p><h1>" + esc(l.title) + '</h1><p class="lede">' + rich(l.summary) + "</p></div>" +
    miniMap(l) + '<div class="lesson-body">' + l.blocks.map(block).join("") + "</div>" +
    '<section class="why" aria-labelledby="why-h"><h2 id="why-h">Why it exists</h2><p class="sub">The part worth being able to say in your own words.</p><dl><dt>Without it</dt><dd>' + rich(l.why.without) + "</dd><dt>Rust's answer</dt><dd>" + rich(l.why.answer) + "</dd><dt>The cost</dt><dd>" + rich(l.why.cost) + "</dd></dl></section>" +
    quiz(l) +
    '<nav class="pager" aria-label="Lessons">' + (prev ? '<a href="#l-' + prev.slug + '"><span class="d">← ' + pad(prev.number) + '</span><span class="t">' + esc(prev.title) + "</span></a>" : '<a href="#map"><span class="d">← Map</span><span class="t">All lessons</span></a>') +
    (next ? '<a class="nx" href="#l-' + next.slug + '"><span class="d">' + pad(next.number) + ' →</span><span class="t">' + esc(next.title) + "</span></a>" : '<a class="nx" href="#map"><span class="d">Finished →</span><span class="t">Back to the map</span></a>') + "</nav></div></main>";
}
let gq = "";
const termsHtml = list => list.length ? list.map(t => '<div class="term"><h2>' + esc(t.name) + "</h2><div><p>" + rich(t.body) + '</p><a class="link" href="#l-' + t.lesson + '">Lesson ' + pad(BY[t.lesson].number) + " · " + esc(BY[t.lesson].title) + "</a></div></div>").join("") : '<p class="muted" style="padding:16px 0">No term matches that.</p>';
const glossFilter = () => { const q = gq.trim().toLowerCase(); return GLOSSARY.filter(t => !q || (t.name + " " + t.body).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name)); };
function viewGlossary() {
  return '<main id="content" class="ref"><div class="wrap narrow"><p class="eyebrow">' + GLOSSARY.length + ' terms</p><h1>Glossary</h1><p class="lede">Each word in a sentence or two, with the lesson that teaches it.</p>' +
    '<input class="filter" id="gq" type="search" placeholder="Filter terms" aria-label="Filter terms" value="' + esc(gq) + '"><div class="terms" id="terms">' + termsHtml(glossFilter()) + "</div></div></main>";
}
function viewSheet() {
  return '<main id="content" class="ref"><div class="wrap"><p class="eyebrow">Keep this open</p><h1>The pocket sheet</h1><p class="lede">The whole course, one line per idea.</p><div class="sheet">' +
    SHEET.map(s => "<section><h2>" + esc(s.title) + "</h2><table>" + s.rows.map(r => "<tr><td>" + esc(r[0]) + "</td><td>" + rich(r[1]) + "</td></tr>").join("") + "</table></section>").join("") + "</div></div></main>";
}
function viewErrors() {
  return '<main id="content" class="ref"><div class="wrap narrow"><p class="eyebrow">' + ERRORS.length + ' errors</p><h1>What the compiler is saying</h1><p class="lede">The concurrency errors you will meet first. Each broken snippet was checked to fail with exactly this message, and each fix to compile.</p><div class="errs">' +
    ERRORS.map(e => '<article class="errcard"><div class="code-id">' + esc(e.code) + "</div><h2>" + esc(e.title) + '</h2><div class="err">' + esc(e.message) + "</div><p>" + rich(e.meaning) + "</p><p><b>Fix.</b> " + rich(e.fix) + "</p>" +
      '<div class="bf"><div class="code"><div class="cap"><span>fails</span></div><pre><code>' + hl(e.broken) + '</code></pre></div><div class="code"><div class="cap"><span>compiles</span></div><pre><code>' + hl(e.fixed) + "</code></pre></div></div>" +
      '<p style="font-size:14px"><a class="link" href="#l-' + e.lesson + '">Lesson ' + pad(BY[e.lesson].number) + " · " + esc(BY[e.lesson].title) + "</a></p></article>").join("") + "</div></div></main>";
}

function render(keepScroll) {
  const y = window.scrollY;
  Object.values(figState).forEach(s => clearTimeout(s.t));
  let body;
  if (R.v === "lesson") body = viewLesson();
  else if (R.v === "glossary") body = viewGlossary();
  else if (R.v === "sheet") body = viewSheet();
  else if (R.v === "errors") body = viewErrors();
  else body = viewHome();
  $("#app").innerHTML = header() + body + footer();
  if (R.v === "map") afterMap();
  setupFigures();
  const titles = { lesson: R.slug && pad(BY[R.slug].number) + ". " + BY[R.slug].title, glossary: "Glossary", sheet: "Pocket sheet", errors: "Compiler errors" };
  document.title = (titles[R.v] ? titles[R.v] + " · " : "") + "Anneal";
  if (keepScroll) window.scrollTo(0, y);
}

window.addEventListener("hashchange", () => {
  if (location.hash === "#content") return;
  const prev = R; R = route(); armed = false;
  if (R.v === "lesson") { P.last = R.slug; save(); }
  if (prev.v === R.v && prev.slug === R.slug) return;
  render(); window.scrollTo(0, 0);
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-skip]")) { e.preventDefault(); const m = $("#content"); if (m) { m.setAttribute("tabindex", "-1"); m.focus(); } return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "answer") {
    const l = BY[R.slug], i = +a.dataset.q, c = +a.dataset.c;
    P.answers[qid(l, i)] = c;
    if (l.quiz.every((q, k) => P.answers[qid(l, k)] === q.answer) && !isDone(l.slug)) { P.done.push(l.slug); toast("Lesson " + pad(l.number) + " done"); }
    save(); render(true);
  } else if (act === "copy") {
    const pre = a.closest(".code").querySelector("pre"), b = BY[R.slug].blocks[+a.dataset.i];
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl+C or ⌘C to copy."); };
    try { navigator.clipboard.writeText(b.code).then(() => toast("Copied"), fallback); } catch (err) { fallback(); }
  } else if (act.startsWith("fig-")) {
    const el = a.closest(".fig"), st = figState[el.dataset.key], n = FIG[el.dataset.fig].frames.length;
    if (act === "fig-play") { st.playing = !st.playing; if (st.playing && st.i === n - 1) st.i = 0; }
    else { st.playing = false; st.i = (st.i + (act === "fig-next" ? 1 : -1) + n) % n; }
    figApply(el, false); figTick(el);
  } else if (act === "reset") { armed = true; render(true); }
  else if (act === "reset-no") { armed = false; render(true); }
  else if (act === "reset-yes") { P = { answers: {}, done: [], last: null, updatedAt: 0 }; armed = false; save(); render(true); toast("Progress cleared"); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "pick") { pickState[R.slug + ":" + t.dataset.i] = t.value; render(true); const el = document.querySelector('input[name="pk-' + t.dataset.i + '"][value="' + t.value + '"]'); if (el) el.focus({ preventScroll: true }); }
});
document.addEventListener("input", e => { if (e.target.id === "gq") { gq = e.target.value; $("#terms").innerHTML = termsHtml(glossFilter()); } });
window.addEventListener("resize", () => { const n = window.innerWidth < 640; if (n !== narrow) { narrow = n; if (R.v === "lesson") render(true); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) Object.values(figState).forEach(s => clearTimeout(s.t)); else document.querySelectorAll(".fig").forEach(figTick); });

if (R.v === "lesson") { P.last = R.slug; try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { } }
render();
connect().then(() => { const n = $("#savenote"); if (remote && n) n.textContent = "Progress is saved to your claude.ai account and this browser."; });
})();

</script>
</body></html>
